<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pomodoro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=IBM+Plex+Sans+KR:wght@500;600&family=Tilt+Neon&display=swap"
    />
    <link rel="stylesheet" href="index.css" />
    <script src="timer-settings.js" defer></script>
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <h1 class="title">Pomodoro</h1>

      <p id="time" class="time" role="timer" aria-label="남은 시간">25:00</p>

      <div class="controls">
        <button id="start-button" class="button button-primary" type="button">시작</button>
        <button id="stop-button" class="button" type="button">정지</button>
        <button id="reset-button" class="button" type="button">초기화</button>
      </div>

      <button id="settings-button" class="settings" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"
          />
        </svg>
        설정
      </button>
    </main>
  </body>
</html>
